<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster Search — Pro Athletes by College</title>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<style>
  :root {
    --bg: #FAFAF8;
    --panel: #F1F2EE;
    --ink: #1A2029;
    --ink-soft: #5B6472;
    --line: #DDE0DA;
    --accent: #1E5B3A;
    --warn: #A45A2A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  #toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 16px 32px;
    display: flex;
    gap: 24px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input, .field select {
    font-family: inherit;
    font-size: 14px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    width: 240px;
    background: white;
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  main { padding: 24px 32px 60px; overflow-x: auto; }

  table.dataTable {
    border-collapse: collapse !important;
    width: 100% !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
  }
  table.dataTable thead th {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    text-align: left;
    padding: 10px 12px;
    border-bottom: 2px solid var(--ink);
  }
  table.dataTable tbody td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
  }
  table.dataTable tbody tr:hover { background: var(--panel); }

  table.dataTable tbody td a {
    text-decoration: none;
    color: var(--accent);
    font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    margin-right: 10px;
  }
  table.dataTable tbody td a:hover { text-decoration: underline; }

  .injury {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--warn);
  }

  .dataTables_wrapper .dataTables_info {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    padding-top: 12px;
  }
  .dataTables_wrapper .dataTables_paginate .paginate_button {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    padding: 5px 10px !important;
    border-radius: 6px !important;
    border: 1px solid var(--line) !important;
    margin-left: 4px;
  }
  .dataTables_wrapper .dataTables_paginate .paginate_button.current {
    background: var(--accent) !important;
    color: white !important;
    border-color: var(--accent) !important;
  }

  footer {
    padding: 16px 32px 32px;
    color: var(--ink-soft);
    font-size: 12px;
  }

  @media (max-width: 700px) {
    header, #toolbar, main, footer { padding-left: 16px; padding-right: 16px; }
    .field input, .field select { width: 100%; }
    #toolbar { flex-direction: column; align-items: stretch; }
    table.dataTable td:nth-child(4),
    table.dataTable th:nth-child(4),
    table.dataTable td:nth-child(7),
    table.dataTable th:nth-child(7) {
      display: none;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Pro athletes by college</h1>
</header>

<div id="toolbar">
  <div class="field">
    <label for="college-select">College</label>
    <select id="college-select">
      <option value="">All Colleges</option>
    </select>
  </div>
  <div class="field">
    <label for="player-search">Player</label>
    <input type="text" id="player-search" placeholder="e.g. Patrick Mahomes">
  </div>
</div>

<main>
  <table id="players" class="display">
    <thead>
      <tr>
        <th>Player</th>
        <th>College</th>
        <th>Team</th>
        <th>Position</th>
        <th>Next Game</th>
        <th>Opponent</th>
        <th>Network</th>
        <th>Injury Status</th>
        <th>Add to Calendar</th>
      </tr>
    </thead>
    <tbody id="players-body"></tbody>
  </table>
</main>

<footer id="footer-note">Loading data…</footer>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
  fetch('players.json')
    .then(response => response.json())
    .then(players => {

      function toUtcStamp(date) {
        return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      }

      function calendarLinks(p) {
        if (!p.kickoff_iso) return null;
        const start = new Date(p.kickoff_iso);
        const end = new Date(start.getTime() + 3 * 60 * 60 * 1000);
        const title = `${p.team ?? ''} ${p.opponent ?? ''}`.trim();
        const desc = `Broadcast: ${p.network ?? 'TBD'}`;
        const startStamp = toUtcStamp(start);
        const endStamp = toUtcStamp(end);

        const ics = [
          'BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT',
          `DTSTART:${startStamp}`, `DTEND:${endStamp}`,
          `SUMMARY:${title}`, `DESCRIPTION:${desc}`,
          'END:VEVENT', 'END:VCALENDAR'
        ].join('\n');
        const iosHref = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);

        const androidHref = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startStamp}/${endStamp}&details=${encodeURIComponent(desc)}`;

        return { iosHref, androidHref };
      }

      const tbody = document.getElementById('players-body');
      players.forEach(p => {
        const epoch = p.kickoff_iso ? new Date(p.kickoff_iso).getTime() : Number.MAX_SAFE_INTEGER;
        const links = calendarLinks(p);
        const calCell = links
          ? `<a href="${links.iosHref}" download="game.ics">iPhone</a>
             <a href="${links.androidHref}" target="_blank">Android</a>`
          : '';
        const injuryCell = p.injury_status ? `<span class="injury">${p.injury_status}</span>` : '';
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${p.full_name ?? ''}</td>
          <td>${p.college ?? ''}</td>
          <td>${p.team ?? ''}</td>
          <td>${p.position ?? ''}</td>
          <td data-order="${epoch}">${p.next_game ?? ''}</td>
          <td>${p.opponent ?? ''}</td>
          <td>${p.network ?? ''}</td>
          <td>${injuryCell}</td>
          <td>${calCell}</td>
        `;
        tbody.appendChild(row);
      });

      const colleges = [...new Set(players.map(p => p.college).filter(Boolean))].sort();
      const collegeSelect = document.getElementById('college-select');
      colleges.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        collegeSelect.appendChild(opt);
      });

      const table = $('#players').DataTable({
        pageLength: 100,
        dom: 'tip'
      });

      $('#college-select').on('change', function() {
        table.column(1).search(this.value ? '^' + $.fn.dataTable.util.escapeRegex(this.value) + '$' : '', true, false).draw();
      });

      $('#player-search').on('keyup change', function() {
        table.column(0).search(this.value).draw();
      });

      collegeSelect.value = 'Texas Tech';
      table.column(1).search('^Texas Tech$', true, false).draw();
    })
    .catch(err => {
      document.getElementById('footer-note').textContent = 'Could not load player data: ' + err;
    });

  fetch('last_updated.json')
    .then(r => r.json())
    .then(d => {
      const dt = new Date(d.updated_at);
      document.getElementById('footer-note').textContent = 'Data last updated: ' + dt.toLocaleString();
    })
    .catch(() => {});
</script>

</body>
</html>
