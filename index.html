<!DOCTYPE html>
<html>
<head>
  <title>Pro Athletes by School</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body>
  <h1>NFL Players by College</h1>
  <table id="players" class="display">
    <thead>
      <tr>
        <th>Player</th>
        <th>Team</th>
        <th>Position</th>
        <th>College</th>
      </tr>
    </thead>
    <tbody id="players-body">
      <!-- Rows get filled in automatically by the script below -->
    </tbody>
  </table>

  <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script>
    fetch('players.json')
      .then(response => response.json())
      .then(players => {
        const tbody = document.getElementById('players-body');
        players.forEach(p => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${p.full_name ?? ''}</td>
            <td>${p.team ?? ''}</td>
            <td>${p.position ?? ''}</td>
            <td>${p.college ?? ''}</td>
          `;
          tbody.appendChild(row);
        });
        $('#players').DataTable();
      })
      .catch(err => {
        document.body.innerHTML += '<p style="color:red">Could not load player data: ' + err + '</p>';
      });
  </script>
</body>
</html>
