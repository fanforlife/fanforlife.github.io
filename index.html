<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster Search — Pro Athletes by College</title>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-content">
    <h1>FROM CAMPUS<br>TO <span>SUNDAY</span></h1>
    <p class="hero-sub">Search every pro athlete by the college that made them.</p>
  </div>
  <div class="scroll-cue">
    Scroll
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m0 0l-6-6m6 6l6-6"/></svg>
  </div>
</section>

<div class="app-section">
  <div id="toolbar">
    <div class="field">
      <label for="college-select">College</label>
      <select id="college-select">
        <option value="">All Colleges</option>
      </select>
    </div>
    <div class="field">
      <label for="player-search">Player</label>
      <input type="text" id="player-search" placeholder="e.g. Patrick Mahomes">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button id="columns-toggle" type="button">⚙ Columns</button>
      <div id="columns-panel"></div>
    </div>
  </div>

  <main id="main-table">
    <table id="players" class="display">
      <thead>
        <tr>
          <th>Player</th>
          <th>College</th>
          <th>Team</th>
          <th>Position</th>
          <th>Next Game</th>
          <th>Opponent</th>
          <th>Network</th>
          <th>Injury Status</th>
          <th>Add to Calendar</th>
        </tr>
      </thead>
      <tbody id="players-body"></tbody>
    </table>
  </main>

  <footer class="page-footer" id="footer-note">Loading data…</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);

  gsap.to('#hero-bg', {
    yPercent: 15,
    ease: 'none',
    scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true }
  });

  gsap.from('.hero-content', { opacity: 0, y: 30, duration: 1.1, ease: 'power2.out', delay: 0.2 });

  gsap.to('#main-table', {
    opacity: 1,
    y: 0,
    duration: 0.9,
    ease: 'power2.out',
    scrollTrigger: { trigger: '#main-table', start: 'top 85%' }
  });

  fetch('players.json')
    .then(response => response.json())
    .then(players => {

      function toUtcStamp(date) {
        return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      }

      function calendarLinks(p) {
        if (!p.kickoff_iso) return null;
        const start = new Date(p.kickoff_iso);
        const end = new Date(start.getTime() + 3 * 60 * 60 * 1000);
        const title = `${p.team ?? ''} ${p.opponent ?? ''}`.trim();
        const desc = `Broadcast: ${p.network ?? 'TBD'}`;
        const startStamp = toUtcStamp(start);
        const endStamp = toUtcStamp(end);

        const ics = [
          'BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT',
          `DTSTART:${startStamp}`, `DTEND:${endStamp}`,
          `SUMMARY:${title}`, `DESCRIPTION:${desc}`,
          'END:VEVENT', 'END:VCALENDAR'
        ].join('\n');
        const iosHref = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);

        const androidHref = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startStamp}/${endStamp}&details=${encodeURIComponent(desc)}`;

        return { iosHref, androidHref };
      }

      const tbody = document.getElementById('players-body');
      players.forEach(p => {
        const epoch = p.kickoff_iso ? new Date(p.kickoff_iso).getTime() : Number.MAX_SAFE_INTEGER;
        const links = calendarLinks(p);
        const calCell = links
          ? `<a href="${links.iosHref}" download="game.ics">iPhone</a>
             <a href="${links.androidHref}" target="_blank">Android</a>`
          : '';
        const injuryCell = p.injury_status ? `<span class="injury">${p.injury_status}</span>` : '';
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${p.full_name ?? ''}</td>
          <td>${p.college ?? ''}</td>
          <td>${p.team ?? ''}</td>
          <td>${p.position ?? ''}</td>
          <td data-order="${epoch}">${p.next_game ?? ''}</td>
          <td>${p.opponent ?? ''}</td>
          <td>${p.network ?? ''}</td>
          <td>${injuryCell}</td>
          <td>${calCell}</td>
        `;
        tbody.appendChild(row);
      });

      const colleges = [...new Set(players.map(p => p.college).filter(Boolean))].sort();
      const collegeSelect = document.getElementById('college-select');
      colleges.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        collegeSelect.appendChild(opt);
      });

      const table = $('#players').DataTable({
        pageLength: 100,
        dom: 'tip',
        columnDefs: [
          { targets: 4, orderData: [4, 2, 0] }
        ]
      });

      $('#college-select').on('change', function() {
        table.column(1).search(this.value ? '^' + $.fn.dataTable.util.escapeRegex(this.value) + '$' : '', true, false).draw();
      });

      $('#player-search').on('keyup change', function() {
        table.column(0).search(this.value).draw();
      });

      const COLUMNS = [
        { key: 'team', label: 'Team', index: 2 },
        { key: 'position', label: 'Position', index: 3 },
        { key: 'nextgame', label: 'Next Game', index: 4 },
        { key: 'opponent', label: 'Opponent', index: 5 },
        { key: 'network', label: 'Network', index: 6 },
        { key: 'injury', label: 'Injury Status', index: 7 },
        { key: 'calendar', label: 'Add to Calendar', index: 8 }
      ];
      const MOBILE_DEFAULT_HIDDEN = ['position', 'network', 'injury', 'calendar'];

      function loadColumnPrefs() {
        try {
          const saved = localStorage.getItem('ffl_column_prefs');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        const isMobile = window.innerWidth < 700;
        const prefs = {};
        COLUMNS.forEach(c => {
          prefs[c.key] = isMobile ? !MOBILE_DEFAULT_HIDDEN.includes(c.key) : true;
        });
        return prefs;
      }
      function saveColumnPrefs(prefs) {
        try { localStorage.setItem('ffl_column_prefs', JSON.stringify(prefs)); } catch (e) {}
      }

      const columnPrefs = loadColumnPrefs();
      COLUMNS.forEach(c => table.column(c.index).visible(!!columnPrefs[c.key]));

      const panel = document.getElementById('columns-panel');
      panel.innerHTML = COLUMNS.map(c => `
        <label><input type="checkbox" data-key="${c.key}" ${columnPrefs[c.key] ? 'checked' : ''}> ${c.label}</label>
      `).join('');
      panel.querySelectorAll('input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', function() {
          const col = COLUMNS.find(c => c.key === this.dataset.key);
          columnPrefs[this.dataset.key] = this.checked;
          table.column(col.index).visible(this.checked);
          saveColumnPrefs(columnPrefs);
        });
      });
      document.getElementById('columns-toggle').addEventListener('click', function(e) {
        e.stopPropagation();
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
      });
      document.addEventListener('click', function(e) {
        if (!panel.contains(e.target) && e.target.id !== 'columns-toggle') {
          panel.style.display = 'none';
        }
      });

      collegeSelect.value = 'Texas Tech';
      table.column(1).search('^Texas Tech$', true, false).draw();
    })
    .catch(err => {
      document.getElementById('footer-note').textContent = 'Could not load player data: ' + err;
    });

  fetch('last_updated.json')
    .then(r => r.json())
    .then(d => {
      const dt = new Date(d.updated_at);
      document.getElementById('footer-note').textContent = 'Data last updated: ' + dt.toLocaleString();
    })
    .catch(() => {});
</script>

</body>
</html>
