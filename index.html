<!DOCTYPE html>
<html>
<head>
  <title>Pro Athletes by School</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    #search-box { margin-bottom: 15px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
    #search-box input, #search-box select { padding: 8px; font-size: 16px; }
    #search-box input { width: 260px; }
    table.dataTable { font-size: 14px; }
  </style>
</head>
<body>
  <h1>Pro Athletes by College</h1>

  <div id="search-box">
    <div>
      <label for="college-search"><strong>Search by college:</strong></label><br>
      <input type="text" id="college-search" list="college-list" placeholder="e.g. Ohio State">
      <datalist id="college-list"></datalist>
    </div>
    <div>
      <label for="player-search"><strong>Search by player name:</strong></label><br>
      <input type="text" id="player-search" list="player-list" placeholder="e.g. Patrick Mahomes">
      <datalist id="player-list"></datalist>
    </div>
    <div>
      <label for="sport-filter"><strong>Sport:</strong></label><br>
      <select id="sport-filter">
        <option value="">All Sports</option>
        <option value="NFL">NFL</option>
        <option value="NBA">NBA</option>
        <option value="MLB">MLB</option>
      </select>
    </div>
  </div>

  <table id="players" class="display">
    <thead>
      <tr>
        <th>Sport</th>
        <th>Player</th>
        <th>Team</th>
        <th>Position</th>
        <th>College</th>
        <th>Next Game</th>
        <th>Opponent</th>
        <th>Central</th>
        <th>Pacific</th>
        <th>Network</th>
      </tr>
    </thead>
    <tbody id="players-body">
    </tbody>
  </table>

  <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script>
    fetch('players.json')
      .then(response => response.json())
      .then(players => {
        const tbody = document.getElementById('players-body');
        players.forEach(p => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${p.sport ?? ''}</td>
            <td>${p.full_name ?? ''}</td>
            <td>${p.team ?? ''}</td>
            <td>${p.position ?? ''}</td>
            <td>${p.college ?? ''}</td>
            <td>${p.date ?? ''}</td>
            <td>${p.opponent ?? ''}</td>
            <td>${p.time_cst ?? ''}</td>
            <td>${p.time_pst ?? ''}</td>
            <td>${p.network ?? ''}</td>
          `;
          tbody.appendChild(row);
        });

        // Populate autocomplete lists
        const colleges = [...new Set(players.map(p => p.college).filter(Boolean))].sort();
        const collegeList = document.getElementById('college-list');
        colleges.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          collegeList.appendChild(opt);
        });

        const names = [...new Set(players.map(p => p.full_name).filter(Boolean))].sort();
        const playerList = document.getElementById('player-list');
        names.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n;
          playerList.appendChild(opt);
        });

        const table = $('#players').DataTable({
          pageLength: 100
        });

        $('#college-search').on('keyup change', function() {
          table.column(4).search(this.value).draw();
        });

        $('#player-search').on('keyup change', function() {
          table.column(1).search(this.value).draw();
        });

        $('#sport-filter').on('change', function() {
          table.column(0).search(this.value).draw();
        });

        // Default view: Texas Tech only
        $('#college-search').val('Texas Tech');
        table.column(4).search('Texas Tech').draw();
      })
      .catch(err => {
        document.body.innerHTML += '<p style="color:red">Could not load player data: ' + err + '</p>';
      });
  </script>
</body>
</html>
