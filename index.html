<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster Search — Pro Athletes by College</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-content">
    <h1>FROM CAMPUS<br>TO <span>SUNDAY</span></h1>
    <p class="hero-sub">Search every pro athlete by the college that made them.</p>
  </div>
  <div class="scroll-cue">
    Scroll
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m0 0l-6-6m6 6l6-6"/></svg>
  </div>
</section>

<div class="app-section">
  <div id="toolbar">
    <div class="toolbar-fields">
      <div class="field">
        <label for="college-select">College</label>
        <select id="college-select">
          <option value="">All Colleges</option>
        </select>
      </div>
      <div class="field">
        <label for="player-search">Player</label>
        <input type="text" id="player-search" placeholder="e.g. Patrick Mahomes">
      </div>
      <div class="field">
        <label>Sort By</label>
        <div class="sort-toggle">
          <button id="sort-soonest" class="active" type="button">Soonest</button>
          <button id="sort-most" type="button">Most Alumni</button>
        </div>
      </div>
    </div>
    <p class="toolbar-hint">Tap any game to see the alumni playing in it.</p>
  </div>

  <main id="main-area">
    <div id="games-container"></div>
  </main>

  <footer class="page-footer" id="footer-note">Loading data…</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  gsap.to('#hero-bg', {
    yPercent: 15, ease: 'none',
    scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true }
  });
  gsap.from('.hero-content', { opacity: 0, y: 30, duration: 1.1, ease: 'power2.out', delay: 0.2 });
  gsap.to('#main-area', {
    opacity: 1, y: 0, duration: 0.7, ease: 'power2.out',
    scrollTrigger: { trigger: '#main-area', start: 'top 90%' }
  });

  const TEAMS = {
    ARI: { short: 'Cardinals', color: '#97233F' },
    ATL: { short: 'Falcons', color: '#A71930' },
    BAL: { short: 'Ravens', color: '#241773' },
    BUF: { short: 'Bills', color: '#00338D' },
    CAR: { short: 'Panthers', color: '#0085CA' },
    CHI: { short: 'Bears', color: '#4169E1' },
    CIN: { short: 'Bengals', color: '#FB4F14' },
    CLE: { short: 'Browns', color: '#FF6B00' },
    DAL: { short: 'Cowboys', color: '#7A9BC4' },
    DEN: { short: 'Broncos', color: '#FB4F14' },
    DET: { short: 'Lions', color: '#0076B6' },
    GB:  { short: 'Packers', color: '#2E7D4F' },
    HOU: { short: 'Texans', color: '#D6224A' },
    IND: { short: 'Colts', color: '#3B7DD8' },
    JAX: { short: 'Jaguars', color: '#00A6A0' },
    KC:  { short: 'Chiefs', color: '#E31837' },
    LV:  { short: 'Raiders', color: '#A5ACAF' },
    LAC: { short: 'Chargers', color: '#22A5E0' },
    LAR: { short: 'Rams', color: '#3161C4' },
    MIA: { short: 'Dolphins', color: '#00C4CC' },
    MIN: { short: 'Vikings', color: '#8B5CD6' },
    NE:  { short: 'Patriots', color: '#D6224A' },
    NO:  { short: 'Saints', color: '#D3BC8D' },
    NYG: { short: 'Giants', color: '#3B5FCC' },
    NYJ: { short: 'Jets', color: '#2FA878' },
    PHI: { short: 'Eagles', color: '#2E8B7A' },
    PIT: { short: 'Steelers', color: '#FFB612' },
    SF:  { short: '49ers', color: '#D6224A' },
    SEA: { short: 'Seahawks', color: '#69BE28' },
    TB:  { short: 'Buccaneers', color: '#D50A0A' },
    TEN: { short: 'Titans', color: '#4B92DB' },
    WAS: { short: 'Commanders', color: '#FFB612' }
  };
  function teamInfo(abbr) { return TEAMS[abbr] || { short: abbr, color: '#888' }; }

  function toUtcStamp(date) { return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z'; }
  function gameCalendarLinks(game) {
    const start = new Date(game.kickoff_iso);
    const end = new Date(start.getTime() + 3 * 60 * 60 * 1000);
    const title = `${teamInfo(game.away).short} at ${teamInfo(game.home).short}`;
    const desc = `Broadcast: ${game.network ?? 'TBD'}`;
    const startStamp = toUtcStamp(start), endStamp = toUtcStamp(end);
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',`DTSTART:${startStamp}`,`DTEND:${endStamp}`,`SUMMARY:${title}`,`DESCRIPTION:${desc}`,'END:VEVENT','END:VCALENDAR'].join('\n');
    const iosHref = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    const androidHref = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startStamp}/${endStamp}&details=${encodeURIComponent(desc)}`;
    return { iosHref, androidHref };
  }

  function compactTime(iso) {
    const d = new Date(iso);
    const ct = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Chicago' }).replace(' ', '').toLowerCase();
    const pt = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' }).replace(' ', '').toLowerCase();
    return `${ct} CT / ${pt} PT`;
  }
  function dayBucket(iso) {
    const d = new Date(iso);
    const dayName = d.toLocaleDateString('en-US', { weekday: 'long', timeZone: 'America/Chicago' });
    const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'America/Chicago' });
    const key = d.toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
    return { key, dayName, dateStr };
  }

  function oppAbbr(opponentStr) { return opponentStr.replace(/^(vs|@)\s*/, '').trim(); }
  function isHome(opponentStr) { return opponentStr.trim().startsWith('vs'); }

  function renderPlayerRow(p) {
    const injuryTag = p.injury_status ? `<span class="injury-tag">${p.injury_status}</span>` : '';
    return `<div class="player-row"><span class="player-name">${p.full_name ?? ''}</span><span class="player-pos">${p.position ?? ''}</span>${injuryTag}</div>`;
  }

  let rowIdCounter = 0;

  function renderGameRow(game) {
    const away = teamInfo(game.away), home = teamInfo(game.home);
    const awayPlayers = game.players[game.away] || [];
    const homePlayers = game.players[game.home] || [];
    const cal = gameCalendarLinks(game);
    const totalAlumni = awayPlayers.length + homePlayers.length;
    const rowId = 'game-' + (rowIdCounter++);
    return `
      <div class="game-row" id="${rowId}">
        <div class="game-row-header" onclick="document.getElementById('${rowId}').classList.toggle('expanded')">
          <div class="matchup-compact">
            <span class="team-chip" style="--team-color:${away.color}; width:8px;height:8px;border-radius:50%;background:${away.color};box-shadow:0 0 8px ${away.color};flex-shrink:0;"></span>
            <span class="name">${away.short}</span>
            <span class="vs-sep">at</span>
            <span class="team-chip" style="--team-color:${home.color}; width:8px;height:8px;border-radius:50%;background:${home.color};box-shadow:0 0 8px ${home.color};flex-shrink:0;"></span>
            <span class="name">${home.short}</span>
          </div>
          <span class="time-compact">${compactTime(game.kickoff_iso)}</span>
          <span class="alumni-badge">${totalAlumni}</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="game-row-detail">
          <div class="detail-meta">
            <span class="chip network-chip">${game.network ?? 'TBD'}</span>
            <a class="cal-btn" href="${cal.iosHref}" download="game.ics">📅 iPhone</a>
            <a class="cal-btn" href="${cal.androidHref}" target="_blank">📅 Android</a>
          </div>
          <div class="game-card-body">
            <div class="team-column">
              <div class="team-column-header">${away.short}</div>
              ${awayPlayers.map(renderPlayerRow).join('') || '<p class="none">No alumni</p>'}
            </div>
            <div class="team-column">
              <div class="team-column-header">${home.short}</div>
              ${homePlayers.map(renderPlayerRow).join('') || '<p class="none">No alumni</p>'}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  let ALL_PLAYERS = [];
  let sortMode = 'soonest';

  function renderGames() {
    const collegeFilter = document.getElementById('college-select').value;
    const playerFilter = document.getElementById('player-search').value.trim().toLowerCase();

    const filtered = ALL_PLAYERS.filter(p => {
      if (!p.kickoff_iso || !p.opponent) return false;
      if (collegeFilter && p.college !== collegeFilter) return false;
      if (playerFilter && !(p.full_name ?? '').toLowerCase().includes(playerFilter)) return false;
      return true;
    });

    const gamesMap = new Map();
    filtered.forEach(p => {
      const opp = oppAbbr(p.opponent);
      const key = [p.team, opp].sort().join('_') + '_' + p.kickoff_iso;
      if (!gamesMap.has(key)) {
        const home = isHome(p.opponent) ? p.team : opp;
        const away = isHome(p.opponent) ? opp : p.team;
        gamesMap.set(key, { kickoff_iso: p.kickoff_iso, network: p.network, home, away, players: { [home]: [], [away]: [] } });
      }
      gamesMap.get(key).players[p.team].push(p);
    });

    let games = Array.from(gamesMap.values());
    if (sortMode === 'soonest') {
      games.sort((a, b) => new Date(a.kickoff_iso) - new Date(b.kickoff_iso));
    } else {
      games.sort((a, b) => {
        const countA = Object.values(a.players).flat().length;
        const countB = Object.values(b.players).flat().length;
        return countB - countA;
      });
    }

    const container = document.getElementById('games-container');
    if (games.length === 0) {
      container.innerHTML = '<p class="none" style="text-align:center;">No upcoming games match this search.</p>';
      return;
    }

    if (sortMode === 'most') {
      container.innerHTML = `<div class="day-group">${games.map(renderGameRow).join('')}</div>`;
    } else {
      const dayGroups = new Map();
      games.forEach(g => {
        const b = dayBucket(g.kickoff_iso);
        if (!dayGroups.has(b.key)) dayGroups.set(b.key, { ...b, games: [] });
        dayGroups.get(b.key).games.push(g);
      });
      container.innerHTML = Array.from(dayGroups.values()).map(dg => `
        <div class="day-group">
          <div class="day-header">
            <span class="day-name">${dg.dayName}</span>
            <span class="day-date">${dg.dateStr}</span>
          </div>
          ${dg.games.map(renderGameRow).join('')}
        </div>
      `).join('');
    }

    gsap.utils.toArray('.day-group').forEach((group, i) => {
      gsap.from(group, {
        opacity: 0, y: 16, duration: 0.4, delay: i * 0.04, ease: 'power2.out',
        scrollTrigger: { trigger: group, start: 'top 95%' }
      });
    });
  }

  fetch('players.json')
    .then(r => r.json())
    .then(players => {
      ALL_PLAYERS = players;

      const colleges = [...new Set(players.map(p => p.college).filter(Boolean))].sort();
      const collegeSelect = document.getElementById('college-select');
      colleges.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        collegeSelect.appendChild(opt);
      });
      collegeSelect.value = 'Texas Tech';

      document.getElementById('college-select').addEventListener('change', renderGames);
      document.getElementById('player-search').addEventListener('keyup', renderGames);
      document.getElementById('sort-soonest').addEventListener('click', function() {
        sortMode = 'soonest';
        this.classList.add('active');
        document.getElementById('sort-most').classList.remove('active');
        renderGames();
      });
      document.getElementById('sort-most').addEventListener('click', function() {
        sortMode = 'most';
        this.classList.add('active');
        document.getElementById('sort-soonest').classList.remove('active');
        renderGames();
      });

      renderGames();
    })
    .catch(err => {
      document.getElementById('footer-note').textContent = 'Could not load player data: ' + err;
    });

  fetch('last_updated.json')
    .then(r => r.json())
    .then(d => {
      const dt = new Date(d.updated_at);
      document.getElementById('footer-note').textContent = 'Data last updated: ' + dt.toLocaleString();
    })
    .catch(() => {});
</script>

</body>
</html>
