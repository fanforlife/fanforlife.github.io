<!DOCTYPE html>
<html>
<head>
  <title>Pro Athletes by School</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    #search-box { margin-bottom: 15px; }
    #search-box input { padding: 8px; font-size: 16px; width: 300px; }
  </style>
</head>
<body>
  <h1>NFL Players by College</h1>

  <div id="search-box">
    <label for="college-search"><strong>Search by college:</strong></label><br>
    <input type="text" id="college-search" placeholder="e.g. Ohio State">
  </div>

  <table id="players" class="display">
    <thead>
      <tr>
        <th>Player</th>
        <th>Team</th>
        <th>Position</th>
        <th>College</th>
      </tr>
    </thead>
    <tbody id="players-body">
    </tbody>
  </table>

  <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script>
    fetch('players.json')
      .then(response => response.json())
      .then(players => {
        const tbody = document.getElementById('players-body');
        players.forEach(p => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${p.full_name ?? ''}</td>
            <td>${p.team ?? ''}</td>
            <td>${p.position ?? ''}</td>
            <td>${p.college ?? ''}</td>
          `;
          tbody.appendChild(row);
        });

        const table = $('#players').DataTable();

        // Dedicated college search box, filters only the College column (index 3)
        $('#college-search').on('keyup', function() {
          table.column(3).search(this.value).draw();
        });
      })
      .catch(err => {
        document.body.innerHTML += '<p style="color:red">Could not load player data: ' + err + '</p>';
      });
  </script>
</body>
</html>
